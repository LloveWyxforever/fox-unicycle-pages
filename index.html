<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月光杂技团 · 狐狸的单轮舞</title>
  <style>
    :root{color-scheme:dark;--cream:#f7edd5;--muted:#a9b6b5;--line:rgba(244,238,210,.17);--gold:#ffd477;--cyan:#8bd9d5}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;background:#081719;color:var(--cream);overflow:hidden}
    .app{height:100%;min-height:620px;position:relative;isolation:isolate;background:radial-gradient(circle at 53% 43%,#1d4547 0,#102d31 39%,#091b1d 72%,#061315 100%)}
    .app:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;opacity:.18;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.62' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E")}
    .stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#d5f1e9;opacity:.5;box-shadow:0 0 9px #b9efe6;animation:twinkle 4s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.12;transform:scale(.5)}}
    header{position:absolute;z-index:6;top:42px;left:clamp(26px,5.5vw,92px);max-width:415px;pointer-events:none}.eyebrow{display:flex;align-items:center;gap:11px;text-transform:uppercase;letter-spacing:.27em;color:var(--gold);font:700 11px/1.3 ui-sans-serif,system-ui,sans-serif}.eyebrow:before{content:"";height:1px;width:30px;background:var(--gold)}h1{font-family:Georgia,"Noto Serif SC","Songti SC",serif;font-weight:400;font-size:clamp(42px,5vw,76px);line-height:1.12;letter-spacing:.035em;margin:21px 0 16px;text-shadow:0 7px 35px #001}header p{margin:0;color:#c5d4ce;line-height:1.8;font-size:14px;letter-spacing:.08em}.badge{margin-top:26px;display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:99px;padding:9px 13px;background:rgba(8,29,31,.42);font-size:11px;letter-spacing:.1em;color:#d0d9ce}.badge i{height:7px;width:7px;background:#b5edaf;border-radius:50%;box-shadow:0 0 12px #b5edaf}
    .stage{position:absolute;inset:0;touch-action:none;cursor:grab}.stage.dragging{cursor:grabbing}svg{display:block;width:100%;height:100%}
    .controls{position:absolute;z-index:6;right:clamp(25px,4.4vw,75px);top:50%;transform:translateY(-45%);width:240px;padding:22px;border:1px solid var(--line);background:rgba(9,32,34,.74);backdrop-filter:blur(18px);box-shadow:0 20px 70px rgba(0,0,0,.18);border-radius:19px}.section-title{font-size:10px;font-weight:700;letter-spacing:.25em;color:#a4bab3;text-transform:uppercase;margin:0 0 16px}.view-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.view-btn,.icon-btn{cursor:pointer;color:#d3dfd8;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.11);border-radius:9px;padding:10px 8px;font:600 12px/1.3 inherit;transition:.2s}.view-btn:hover,.icon-btn:hover{background:rgba(255,255,255,.1)}.view-btn.active{color:#12282a;background:var(--gold);border-color:var(--gold)}.divider{height:1px;background:var(--line);margin:22px 0}.range-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;font-size:12px}.range-head output{color:var(--gold);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#ffd477;cursor:pointer}.switch-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;font-size:12px;color:#d3dfd8}.switch{position:relative;width:38px;height:22px;display:inline-block}.switch input{opacity:0;width:0;height:0}.switch span{position:absolute;inset:0;background:#335052;border-radius:99px;cursor:pointer;transition:.2s}.switch span:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#dae5d9;border-radius:50%;transition:.2s}.switch input:checked+span{background:#dba64b}.switch input:checked+span:after{transform:translateX(16px);background:white}.play{margin-top:22px;width:100%;background:transparent;border-color:rgba(255,212,119,.55);color:var(--gold);letter-spacing:.08em}.hint{position:absolute;z-index:6;left:clamp(26px,5.5vw,92px);bottom:35px;color:#9ab3ad;font-size:11px;letter-spacing:.06em;display:flex;gap:18px}.hint span{display:inline-flex;align-items:center;gap:8px}.mouse{width:13px;height:19px;border:1px solid currentColor;border-radius:7px;display:inline-block;position:relative}.mouse:before{content:"";position:absolute;top:4px;left:5px;width:1px;height:5px;background:currentColor}.key{border:1px solid currentColor;border-radius:4px;padding:1px 5px;font-size:10px}
    .signature{position:absolute;right:clamp(25px,4.4vw,75px);bottom:35px;color:#91aaa3;letter-spacing:.24em;text-transform:uppercase;font-size:10px;z-index:6}
    @media(max-width:800px){body{overflow:auto}.app{min-height:820px;height:100vh}.stage{top:150px;bottom:170px}.controls{top:auto;right:18px;left:18px;bottom:55px;width:auto;transform:none;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:0 17px}.controls .section-title{grid-column:1/-1;margin-bottom:9px}.view-grid{grid-column:1/-1;grid-template-columns:repeat(4,1fr)}.view-btn{padding:8px 2px}.divider{display:none}.range-head{margin-top:15px}.switch-row{margin-top:15px}.play{margin-top:12px;grid-column:1/-1}.hint,.signature,.badge{display:none}header{top:25px;left:23px}h1{font-size:38px;margin:11px 0 5px}header p{font-size:12px}}
  </style>
</head>
<body>
<main class="app">
  <div class="stars" id="stars" aria-hidden="true"></div>
  <header>
    <div class="eyebrow">The moonlit circus · No. 01</div>
    <h1>狐狸的<br>单轮舞</h1>
    <p>一圈又一圈，三颗流星在爪尖起舞。</p>
    <div class="badge"><i></i> 正在上演 · 3D 互动场景</div>
  </header>
  <div class="stage" id="stage" aria-label="可拖动旋转的狐狸单轮车 SVG 动画">
    <svg id="scene" viewBox="0 0 1200 800" role="img" aria-label="狐狸骑着单轮车绕圈并抛接彩球">
      <defs>
        <radialGradient id="floor" cx="50%" cy="45%" r="52%"><stop stop-color="#33706d" stop-opacity=".42"/><stop offset=".65" stop-color="#215451" stop-opacity=".17"/><stop offset="1" stop-color="#173d3c" stop-opacity="0"/></radialGradient>
        <radialGradient id="orange" cx="32%" cy="25%" r="75%"><stop stop-color="#ffd18a"/><stop offset=".32" stop-color="#fa9b48"/><stop offset=".78" stop-color="#db5d29"/><stop offset="1" stop-color="#903620"/></radialGradient>
        <radialGradient id="head" cx="30%" cy="23%" r="80%"><stop stop-color="#ffd48e"/><stop offset=".32" stop-color="#f6a24c"/><stop offset=".72" stop-color="#e7742f"/><stop offset="1" stop-color="#a84725"/></radialGradient>
        <radialGradient id="cream" cx="30%" cy="20%" r="80%"><stop stop-color="#fffef2"/><stop offset=".65" stop-color="#f3e7cc"/><stop offset="1" stop-color="#d6bf9b"/></radialGradient>
        <radialGradient id="dark" cx="32%" cy="25%" r="78%"><stop stop-color="#526669"/><stop offset=".45" stop-color="#223f42"/><stop offset="1" stop-color="#0b2428"/></radialGradient>
        <radialGradient id="red" cx="29%" cy="24%" r="80%"><stop stop-color="#ffe0c7"/><stop offset=".22" stop-color="#ff807b"/><stop offset=".75" stop-color="#df4a60"/><stop offset="1" stop-color="#972c51"/></radialGradient>
        <radialGradient id="blue" cx="29%" cy="24%" r="80%"><stop stop-color="#e6ffef"/><stop offset=".22" stop-color="#8fe8d9"/><stop offset=".75" stop-color="#37acb1"/><stop offset="1" stop-color="#1d6882"/></radialGradient>
        <radialGradient id="yellow" cx="29%" cy="24%" r="80%"><stop stop-color="#fff7cf"/><stop offset=".25" stop-color="#ffe48b"/><stop offset=".75" stop-color="#f3ad46"/><stop offset="1" stop-color="#ab622b"/></radialGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
        <filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
      </defs>
      <g id="backdrop"></g><g id="world"></g><g id="foreground"></g>
    </svg>
  </div>
  <aside class="controls" aria-label="动画控制">
    <div class="section-title">切换视角 · Camera angle</div>
    <div class="view-grid" id="views"><button class="view-btn active" data-view="free">自由视角</button><button class="view-btn" data-view="front">正面</button><button class="view-btn" data-view="side">侧面</button><button class="view-btn" data-view="top">俯瞰</button></div>
    <div class="divider"></div>
    <div class="range-head"><span>演出速度</span><output id="speedText">1.0×</output></div>
    <input id="speed" type="range" min="0.2" max="2.5" step="0.1" value="1" aria-label="演出速度">
    <label class="switch-row">显示运动轨迹 <span class="switch"><input id="trails" type="checkbox" checked><span></span></span></label>
    <button class="icon-btn play" id="play" aria-label="暂停动画">Ⅱ&nbsp; 暂停演出</button>
  </aside>
  <div class="hint"><span><i class="mouse"></i> 拖动旋转视角</span><span><i class="key">⌁</i> 滚轮缩放</span></div>
  <div class="signature">An SVG miniature theatre</div>
</main>
<script>
(() => {
  const svg=document.getElementById('scene'), world=document.getElementById('world'),back=document.getElementById('backdrop'),fore=document.getElementById('foreground');
  const stage=document.getElementById('stage'),buttons=[...document.querySelectorAll('.view-btn')];
  const speedInput=document.getElementById('speed'),speedText=document.getElementById('speedText'),trails=document.getElementById('trails'),play=document.getElementById('play');
  let yaw=.55,pitch=.55,dist=13.3,orbit=0,spin=0,clock=0,speed=1,playing=true,last=performance.now(),view='free',drag=null;
  const clamp=(a,l,h)=>Math.max(l,Math.min(h,a)), fmt=n=>Number(n).toFixed(1), esc=n=>Number(n).toFixed(2);
  const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
  const rad=(t)=>[Math.cos(t),0,Math.sin(t)],tan=(t)=>[-Math.sin(t),0,Math.cos(t)];
  function loc(x,y,z,theta=orbit){let r=rad(theta),f=tan(theta),c=[3.05*r[0],0,3.05*r[2]];return [c[0]+r[0]*x+f[0]*z,y,c[2]+r[2]*x+f[2]*z]}
  function project(p){let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),u=[sy*cp,sp,cy*cp],right=[cy,0,-sy],up=[-sy*sp,cp,-cy*sp];let dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],d=dist-dot(p,u),s=690/d;return {x:600+dot(p,right)*s,y:452-dot([p[0],p[1]-1.6,p[2]],up)*s,s,d}}
  function path(points){return points.map((p,i)=>{let q=project(p);return (i?'L':'M')+esc(q.x)+' '+esc(q.y)}).join(' ')}
  function poly(points,fill,stroke='none',sw=1){return `<path d="${path(points)} Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`}
  function line(a,b,color,width,extra=''){let p=project(a),q=project(b);return `<path d="M${esc(p.x)} ${esc(p.y)}L${esc(q.x)} ${esc(q.y)}" fill="none" stroke="${color}" stroke-width="${esc(width*(p.s+q.s)/105)}" stroke-linecap="round" ${extra}/>`}
  function sphere(p,r,fill,ratio=1,extra=''){let q=project(p),rr=Math.max(1,r*q.s);return `<ellipse cx="${esc(q.x)}" cy="${esc(q.y)}" rx="${esc(rr)}" ry="${esc(rr*ratio)}" fill="url(#${fill})" ${extra}/>`}
  function ring(center,r,opacity,color,width=1.5,phase=0){let pts=[];for(let i=0;i<=120;i++){let a=phase+i*Math.PI*2/120;pts.push([center[0]+r*Math.cos(a),center[1],center[2]+r*Math.sin(a)])}return `<path d="${path(pts)}" fill="none" stroke="${color}" stroke-width="${width}" opacity="${opacity}"/>`}
  function depth(p){return project(p).d}
  function render(){
    const floorPts=[];for(let i=0;i<=90;i++){let a=i*Math.PI*2/90;floorPts.push([5.25*Math.cos(a),-.09,5.25*Math.sin(a)])}
    let floor=`<path d="${path(floorPts)} Z" fill="url(#floor)"/>`;
    for(let r of [1.3,2.15,3.05,3.6,4.2]) floor+=ring([0,-.055,0],r,r===3.05?.72:.19,r===3.05?'#dcb97a':'#8bc2ad',r===3.05?2:1);
    for(let i=0;i<28;i++){let a=i*Math.PI*2/28,p=project([3.05*Math.cos(a),-.05,3.05*Math.sin(a)]);floor+=`<circle cx="${esc(p.x)}" cy="${esc(p.y)}" r="${i%7===0?3:1.5}" fill="${i%7===0?'#f9d995':'#7fb4a8'}" opacity=".68"/>`}
    back.innerHTML=floor;
    let entities=[];const push=(p,html)=>entities.push({d:depth(p),html});
    // Shadow under the moving unicycle.
    let sh=project(loc(0,-.07,0));push(loc(0,-.07,0),`<ellipse cx="${esc(sh.x)}" cy="${esc(sh.y)}" rx="${esc(57*sh.s/55)}" ry="${esc(17*sh.s/55)}" fill="#03191b" opacity=".4" filter="url(#shadow)"/>`);
    // The wheel is a projected vertical circle, with a small second rim for depth.
    let wheelC=loc(0,.71,0);let wob=Math.sin(spin)*.018;
    for(let side of [-.09,.09]){let pts=[];for(let i=0;i<=80;i++){let a=i*Math.PI*2/80;pts.push(loc(side,.71+.62*Math.cos(a),.62*Math.sin(a)))}push(loc(side,.71,0),`<path d="${path(pts)}" fill="none" stroke="${side<0?'#577476':'#17383c'}" stroke-width="${side<0?11:13}" stroke-linejoin="round"/>`)}
    let rim=[];for(let i=0;i<=80;i++){let a=i*Math.PI*2/80;rim.push(loc(.02,.71+.62*Math.cos(a),.62*Math.sin(a)))}push(wheelC,`<path d="${path(rim)}" fill="none" stroke="#d3a95f" stroke-width="4"/>`);
    for(let i=0;i<12;i++){let a=i*Math.PI/6+spin,p=loc(.02,.71+.55*Math.cos(a),.55*Math.sin(a));push(wheelC,line(wheelC,p,'#b6c8b6',1.4))}
    push(wheelC,sphere(wheelC,.105,'yellow'));
    let axle=loc(0,.7,0),fork=loc(0,1.46,0),seat=loc(0,1.55,0);
    push(fork,line(axle,fork,'#9bc4b4',7)+line(loc(-.24,.67,0),loc(.24,.67,0),'#c7a767',5));
    push(seat,sphere(seat,.38,'dark',.37)+line(loc(-.34,1.54,0),loc(.34,1.54,0),'#d6a963',3));
    // The fox is built as dimensional, depth-sorted SVG forms.
    let tail0=loc(.05,1.94,-.36),tail1=loc(.32,2.07,-.83),tail2=loc(.49,2.20,-1.18),tailTip=loc(.61,2.3,-1.52);
    push(tail0,line(tail0,tail1,'#b75127',23));push(tail1,sphere(tail1,.35,'orange',.82));push(tail2,sphere(tail2,.37,'orange',.78));push(tailTip,sphere(tailTip,.24,'cream',.78));
    let body=loc(0,2.05,0),belly=loc(0,2.02,.21),head=loc(0,2.72,.11);
    push(body,sphere(body,.59,'orange',1.17));push(belly,sphere(belly,.38,'cream',1.1));
    for(let side of [-1,1]){
      let hip=loc(side*.33,1.82,0),knee=loc(side*.43,1.36,.14),foot=loc(side*.34,1.2,.35);
      push(knee,line(hip,knee,'#b6512d',19)+line(knee,foot,'#7c3b2d',14));push(foot,sphere(foot,.18,'dark',.62));
    }
    let collar=loc(0,2.35,.18);push(collar,sphere(collar,.31,'cream',.65));
    push(head,sphere(head,.54,'head',.94));
    // Ears use two layers; face details remain attached to the fox in 3D.
    for(let side of [-1,1]){
      let a=loc(side*.25,3.02,.06),b=loc(side*.54,3.56,-.02),c=loc(side*.05,3.30,.15);
      push(a,poly([a,b,c],'#d96630','#9d4327',1));
      let ai=loc(side*.25,3.08,.115),bi=loc(side*.49,3.43,.05),ci=loc(side*.14,3.28,.2);push(ai,poly([ai,bi,ci],'#e99583'));
      let cheek=loc(side*.25,2.52,.43);push(cheek,sphere(cheek,.22,'cream',.7));
      let eye=loc(side*.21,2.79,.54);push(eye,sphere(eye,.055,'dark',1)+sphere(loc(side*.19,2.81,.586),.015,'cream'));
      let brow0=loc(side*.13,2.91,.53),brow1=loc(side*.27,2.94,.5);push(brow0,line(brow0,brow1,'#9d4d30',2.3));
    }
    let muzzle=loc(0,2.52,.55),nose=loc(0,2.57,.76);push(muzzle,sphere(muzzle,.28,'cream',.65));push(nose,sphere(nose,.09,'dark',.8));
    let smile0=loc(-.10,2.45,.7),smile1=loc(0,2.42,.72),smile2=loc(.1,2.45,.7);push(smile1,`<path d="${path([smile0,smile1,smile2])}" fill="none" stroke="#855338" stroke-width="2" stroke-linecap="round"/>`);
    // Arms and hands rise and fall with the three-beat cascade.
    for(let side of [-1,1]){
      let sh=loc(side*.42,2.24,.13),el=loc(side*.72,2.22+.06*Math.sin(clock*3+side),.38),hand=loc(side*.74,2.58+.10*Math.sin(clock*3+side),.58);
      push(el,line(sh,el,'#c85d2d',22)+line(el,hand,'#e97c37',17));push(hand,sphere(hand,.16,'orange'));
    }
    // Three balls follow offset parabolic tosses from hand to hand.
    const ballColors=['red','blue','yellow'];let ballFront=[];
    for(let i=0;i<3;i++){
      let phase=((clock*.83+i/3)%1+1)%1,side=phase<.5?-1:1,t=phase<.5?phase*2:(phase-.5)*2;
      let x=side*(.74-1.48*t),y=2.62+1.25*4*t*(1-t),z=.66+.19*Math.sin(Math.PI*t)+.03*i;
      let pos=loc(x,y,z),trail=[];
      if(trails.checked){for(let k=0;k<13;k++){let tt=clamp(t-k*.023,0,1),xx=side*(.74-1.48*tt),yy=2.62+1.25*4*tt*(1-tt);trail.push(loc(xx,yy,.66+.19*Math.sin(Math.PI*tt)+.03*i))}let tp=path(trail);push(pos,`<path d="${tp}" fill="none" stroke="${['#ff8686','#77e6d7','#ffdc80'][i]}" stroke-width="2.4" stroke-linecap="round" opacity=".34"/>`)}
      let ball=sphere(pos,.21,ballColors[i]);push(pos,ball);
      ballFront.push(pos);
    }
    entities.sort((a,b)=>b.d-a.d);world.innerHTML=entities.map(e=>e.html).join('');
    // Floating sparks and a subtle orbit marker in the foreground.
    let f='';for(let i=0;i<10;i++){let a=clock*.19+i*2.399,r=2.1+(i%3)*.9,p=project([r*Math.cos(a),.3+.3*Math.sin(clock+i),r*Math.sin(a)]);f+=`<circle cx="${esc(p.x)}" cy="${esc(p.y)}" r="${i%3===0?2:1.2}" fill="#f7daa1" opacity="${.18+.16*(1+Math.sin(clock*2+i))/2}"/>`}fore.innerHTML=f;
  }
  function setView(v){view=v;buttons.forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='front'){yaw=0;pitch=.23}else if(v==='side'){yaw=Math.PI/2;pitch=.3}else if(v==='top'){yaw=.55;pitch=1.38}else{yaw=.55;pitch=.55}render()}
  buttons.forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
  speedInput.addEventListener('input',()=>{speed=+speedInput.value;speedText.textContent=speed.toFixed(1)+'×'});
  play.addEventListener('click',()=>{playing=!playing;play.innerHTML=playing?'Ⅱ&nbsp; 暂停演出':'▶&nbsp; 继续演出';play.setAttribute('aria-label',playing?'暂停动画':'继续动画')});
  trails.addEventListener('change',render);
  stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};stage.setPointerCapture(e.pointerId);stage.classList.add('dragging')});
  stage.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag.yaw+(e.clientX-drag.x)*.006;pitch=clamp(drag.pitch-(e.clientY-drag.y)*.006,.07,1.49);view='free';buttons.forEach(b=>b.classList.toggle('active',b.dataset.view==='free'));render()});
  const endDrag=()=>{drag=null;stage.classList.remove('dragging')};stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
  stage.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist+Math.sign(e.deltaY)*.65,8.5,19);render()},{passive:false});
  window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){e.preventDefault();play.click()}});
  function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;if(playing){clock+=dt*speed;orbit+=dt*.42*speed;spin+=dt*3*speed;render()}requestAnimationFrame(frame)}
  // Fixed, seeded star field so the atmosphere does not jump on refresh.
  let seed=72;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  document.getElementById('stars').innerHTML=Array.from({length:62},()=>`<i class="star" style="left:${(rnd()*100).toFixed(1)}%;top:${(rnd()*75).toFixed(1)}%;animation-delay:${(rnd()*4).toFixed(1)}s;transform:scale(${(.5+rnd()).toFixed(2)})"></i>`).join('');
  render();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
